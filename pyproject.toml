[project]
name = "pythonproject1"
version = "0.1.0"
description = ""
authors = [
    {name = "2"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=25.9.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "mypy (>=1.18.2,<2.0.0)"
]
[tool.black]
line-length = 119
exclude = '\.git'

[tool.isort]
line_length = 119
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_third_party = ["requests"] # Добавь сюда библиотеки, которые ты используешь

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = ['venv'] #если у тебя venv называется venv, а не .venv
